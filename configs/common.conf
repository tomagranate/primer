# Shared Primer config. Profile fragments add package-manager and platform deps.

[logins]
order =
    github
github_label = GitHub CLI
github_default = yes
github_requires = gh
github_status =
    gh auth status --hostname github.com &&
    test "$(gh config get git_protocol --host github.com 2>/dev/null)" = ssh &&
    key_body="$(awk 'NF >= 2 { print $2; exit }' "$HOME/.ssh/id_ed25519.pub")" &&
    gh ssh-key list | grep -F "$key_body"
github_instruction = Press Enter to start GitHub sign-in. Complete the browser flow. Primer will then verify authentication, SSH mode, and the machine's SSH key.
github_command =
    (gh auth status --hostname github.com >/dev/null 2>&1 && gh auth refresh --hostname github.com --scopes admin:public_key --clipboard || gh auth login --web --clipboard --hostname github.com --git-protocol ssh --scopes admin:public_key --skip-ssh-key) &&
    gh config set git_protocol ssh --host github.com &&
    key_body="$(awk 'NF >= 2 { print $2; exit }' "$HOME/.ssh/id_ed25519.pub")" &&
    if gh ssh-key list | grep -F "$key_body" >/dev/null; then echo "SSH key already registered with GitHub."; else gh ssh-key add "$HOME/.ssh/id_ed25519.pub" --title "$(hostname -s 2>/dev/null || hostname 2>/dev/null || echo primer)"; fi

[git]
label = Git CLI
settings =
    user.name:Tom Grant
    user.email:tom@sunburst.io
    user.useConfigOnly:true
    pull.rebase:false
    init.defaultBranch:master
    push.default:simple
    push.autoSetupRemote:true
    fetch.prune:true
    rerere.enabled:true
    merge.conflictStyle:zdiff3
    diff.algorithm:histogram
    column.ui:auto
    branch.sort:-committerdate
    tag.sort:version:refname

[ssh]
label = SSH key
key_path = ~/.ssh/id_ed25519

[zsh]
label = Zsh + Zim

[starship]
label = Starship prompt

[agents]
label = Agents home
depends_on_logins = github
repo = tomagranate/agents-home
path = ~/.agents
archive_repo = tomagranate/chat-archive
archive_path = ~/.agents-archive
formula = agents
install_method = auto

[mise]
label = Mise languages
tools =
    node:lts
    python:latest
    bun:latest
    rust:latest

[managed-settings]
label = Managed settings
json =
    ~/.claude/settings.json|permissions.defaultMode|"bypassPermissions"
    ~/.claude/settings.json|permissions.skipDangerousModePermissionPrompt|true
    ~/.claude/settings.json|permissions.disableBypassPermissionsMode|delete
    ~/.config/opencode/opencode.jsonc|$schema|"https://opencode.ai/config.json"
    ~/.config/opencode/opencode.jsonc|permission|"allow"
toml =
    ~/.codex/config.toml|approval_policy|"never"
    ~/.codex/config.toml|sandbox_mode|"danger-full-access"
    ~/.codex/config.toml|approvals_reviewer|"user"
    ~/.codex/config.toml|notice.hide_full_access_warning|true
