# Ubuntu desktop profile.

[logins]
order =
    github
    tailscale
github_depends_on = ssh, git, apt
tailscale_label = Tailscale
tailscale_default = yes
tailscale_depends_on = tailscale
tailscale_requires = tailscale
tailscale_status = tailscale status >/dev/null 2>&1
tailscale_command = sudo tailscale up
tailscale_instruction = Complete the browser authentication flow, then return here.
tailscale_done_detail = connected

[apt]
label = APT packages
packages =
    ubuntu-desktop-minimal
    zsh
    git
    gh
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    netcat-openbsd
    build-essential
    docker.io
    docker-compose-v2
    keyd
    flatpak
    gnome-software-plugin-flatpak

[tailscale]
label = Tailscale
depends_on = apt

[flatpak]
label = Flatpak apps
depends_on = apt
remote = flathub
apps =
    com.spotify.Client
    com.discordapp.Discord
    com.google.Chrome
    com.yubico.yubioath

[helium-browser]
label = Helium Browser
depends_on = apt

[shell-installers]
label = Shell installers
depends_on = apt
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      shell: sh
      args: -y -b $HOME/.local/bin
    - name: ghostty
      url: https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh
      command: ghostty
      check: ghostty --version
      shell: bash
      privileged: true
    - name: codex
      url: https://chatgpt.com/codex/install.sh
      command: codex
      check: codex --version
      shell: sh
    - name: claude
      url: https://claude.ai/install.sh
      command: claude
      check: claude --version
      shell: bash

[npm-global]
label = Global npm CLIs
depends_on = mise
packages =
    - name: t3
      package: t3@latest
      command: t3
      check: t3 --version

[git]
depends_on = apt

[ssh]
depends_on = apt

[zsh]
depends_on = apt

[starship]
depends_on = shell-installers

[mise]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh

[ghostty]
label = Ghostty terminal
depends_on = shell-installers

[kde-desktop-settings]
label = KDE desktop settings
depends_on = apt, ghostty
virtual_desktops = 4
