# Ubuntu desktop profile.

[logins]
order =
    github
    tailscale
github_depends_on = ssh, git, github-cli
tailscale_label = Tailscale
tailscale_default = yes
tailscale_depends_on = tailscale
tailscale_requires = tailscale jq
tailscale_status =
    tailscale status >/dev/null 2>&1 &&
    test "$(tailscale debug prefs 2>/dev/null | jq -r '.OperatorUser // ""')" = "${USER:-$LOGNAME}"
tailscale_command =
    (tailscale status >/dev/null 2>&1 || sudo -n tailscale up) &&
    sudo -n tailscale set --operator="${USER:-$LOGNAME}"
tailscale_instruction = Complete the browser authentication flow. Primer will also grant your user permission to run Tailscale Serve for tools like T3 Code.
tailscale_done_detail = connected with serve operator access

[apt]
label = APT packages
needs_sudo = true
packages =
    ubuntu-desktop-minimal
    zsh
    git
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    netcat-openbsd
    build-essential
    docker.io
    docker-compose-v2
    keyd
    flatpak
    gnome-software-plugin-flatpak

[agents-sudo]
label = Agent sudo session

[tailscale]
label = Tailscale
depends_on = apt
needs_sudo = true

[github-cli]
label = GitHub CLI
depends_on = apt

[flatpak]
label = Flatpak apps
depends_on = apt
needs_sudo = true
remote = flathub
apps =
    com.spotify.Client
    com.discordapp.Discord
    com.yubico.yubioath

[google-chrome]
label = Google Chrome
depends_on = apt
needs_sudo = true
format = deb

[helium-browser]
label = Helium Browser
depends_on = apt

[shell-installers]
label = Shell installers
depends_on = apt
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      shell: sh
      args: -y -b $HOME/.local/bin
    - name: ghostty
      url: https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh
      command: ghostty
      check: ghostty --version
      shell: bash
      privileged: true
    - name: codex
      url: https://chatgpt.com/codex/install.sh
      command: codex
      check: codex --version
      shell: sh
    - name: claude
      url: https://claude.ai/install.sh
      command: claude
      check: claude --version
      shell: bash
    - name: opencode
      url: https://opencode.ai/install
      command: opencode
      check: opencode --version
      shell: bash
      args: --no-modify-path
    - name: grok
      url: https://x.ai/cli/install.sh
      command: grok
      check: grok --version
      shell: bash

[npm-global]
label = Global npm CLIs
depends_on = mise
packages =
    - name: t3
      package: t3@latest
      command: t3
      check: t3 --version

[git]
depends_on = apt

[ssh]
depends_on = apt

[zsh]
depends_on = apt

[starship]
depends_on = shell-installers

[agents]
depends_on = apt
install_method = script

[mise]
depends_on = shell-installers

[managed-settings]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh
needs_sudo = true

[ghostty]
label = Ghostty terminal
depends_on = shell-installers

[kde-desktop-settings]
label = KDE desktop settings
depends_on = apt, ghostty
needs_sudo = true
virtual_desktops = 4
