# Ubuntu desktop profile.

[logins]
github_depends_on = ssh, git, apt

[apt]
label = APT packages
packages =
    ubuntu-desktop-minimal
    zsh
    git
    gh
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    netcat-openbsd
    docker.io
    docker-compose-v2
    flatpak
    gnome-software-plugin-flatpak

[tailscale]
label = Tailscale
depends_on = apt

[flatpak]
label = Flatpak apps
depends_on = apt
remote = flathub
apps =
    com.spotify.Client
    com.discordapp.Discord
    com.google.Chrome
    com.yubico.yubioath

[shell-installers]
label = Shell installers
depends_on = apt
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      shell: sh
      args: -y -b $HOME/.local/bin
    - name: ghostty
      url: https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh
      command: ghostty
      check: ghostty --version
      shell: bash
      privileged: true

[git]
depends_on = apt

[ssh]
depends_on = apt

[zsh]
depends_on = apt

[starship]
depends_on = shell-installers

[mise]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh

[ghostty]
label = Ghostty terminal
depends_on = shell-installers
