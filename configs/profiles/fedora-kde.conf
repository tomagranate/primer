# Fedora KDE desktop profile.

[logins]
order =
    onepassword
    github
    tailscale
onepassword_label = 1Password
onepassword_default = yes
onepassword_depends_on = 1password
onepassword_requires = 1password op jq
onepassword_status =
    op account list --format=json 2>/dev/null |
    jq -e 'type == "array" and length > 0' >/dev/null
onepassword_command =
    (pgrep -x 1password >/dev/null 2>&1 || 1password >/dev/null 2>&1 &)
    print "Unlock 1Password. Enable Settings > Developer > Integrate with 1Password CLI."
    print "Press Enter when that is done."
    read -r
    op signin &&
    op account list &&
    op account list --format=json |
    jq -e 'type == "array" and length > 0' >/dev/null
onepassword_instruction = Unlock the 1Password app, then enable Settings > Developer > Integrate with 1Password CLI. Primer will then link the CLI.
onepassword_done_detail = signed in with CLI linked
github_depends_on = ssh, git, dnf
github_depends_on_logins = onepassword
tailscale_label = Tailscale
tailscale_default = yes
tailscale_depends_on = tailscale
tailscale_requires = tailscale jq
tailscale_status =
    tailscale status >/dev/null 2>&1 &&
    test "$(tailscale debug prefs 2>/dev/null | jq -r '.OperatorUser // ""')" = "${USER:-$LOGNAME}"
tailscale_command =
    (tailscale status >/dev/null 2>&1 || sudo tailscale up) &&
    sudo tailscale set --operator="${USER:-$LOGNAME}"
tailscale_instruction = Complete the browser authentication flow, then return here. Primer will also grant your user permission to run Tailscale Serve for tools like T3 Code.
tailscale_done_detail = connected with serve operator access

[dnf]
label = DNF packages
needs_sudo = true
bootstrap_packages =
    dnf5-plugins
coprs =
    scottames/ghostty
    alternateved/keyd
    imput/helium
packages =
    zsh
    git
    gh
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    nmap-ncat
    gcc
    gcc-c++
    make
    moby-engine
    docker-compose
    keyd
    flatpak
    ghostty
    helium-bin
    qt6-qttools
    kf6-kconfig

[fedora-desktop-hardware]
label = Fedora desktop hardware
depends_on = dnf
needs_sudo = true

[fedora-gaming]
label = Fedora gaming
depends_on = fedora-desktop-hardware
needs_sudo = true

[agents-sudo]
label = Agent sudo session

[tailscale]
label = Tailscale
depends_on = dnf
needs_sudo = true

[flatpak]
label = Flatpak apps
depends_on = dnf
needs_sudo = true
remote = flathub
apps =
    com.spotify.Client
    com.discordapp.Discord
    com.yubico.yubioath

[1password]
label = 1Password
depends_on = dnf
needs_sudo = true

[google-chrome]
label = Google Chrome
depends_on = dnf
needs_sudo = true
format = rpm

[shell-installers]
label = Shell installers
depends_on = dnf
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      shell: sh
      args: -y -b $HOME/.local/bin
    - name: codex
      url: https://chatgpt.com/codex/install.sh
      command: codex
      check: codex --version
      shell: sh
    - name: claude
      url: https://claude.ai/install.sh
      command: claude
      check: claude --version
      shell: bash
    - name: opencode
      url: https://opencode.ai/install
      command: opencode
      check: opencode --version
      shell: bash
      args: --no-modify-path
    - name: grok
      url: https://x.ai/cli/install.sh
      command: grok
      check: grok --version
      shell: bash

[npm-global]
label = Global npm CLIs
depends_on = mise
packages =
    - name: t3
      package: t3@latest
      command: t3
      check: t3 --version

[t3-code]
label = T3 Code server
depends_on = npm-global, tailscale, google-chrome
depends_on_logins = tailscale
local_port = 3773
tailscale_serve_port = 443
browser_command = google-chrome-stable
window_size = 1400,900
window_position = 324,110

[git]
depends_on = dnf

[ssh]
depends_on = dnf

[zsh]
depends_on = dnf

[starship]
depends_on = shell-installers

[agents]
depends_on = dnf
install_method = script

[mise]
depends_on = shell-installers

[managed-settings]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh
needs_sudo = true

[ghostty]
label = Ghostty terminal
depends_on = dnf

[kde-desktop-settings]
label = KDE desktop settings
depends_on = dnf, ghostty
needs_sudo = true
virtual_desktops = 4
keyd_command = keyd
qdbus_command = qdbus-qt6

[kde-taskbar-pins]
label = KDE taskbar pins
depends_on = kde-desktop-settings, t3-code
qdbus_command = qdbus-qt6
launchers =
    applications:systemsettings.desktop
    applications:org.kde.discover.desktop
    applications:helium.desktop
    preferred://filemanager
    applications:1password.desktop
    applications:chatgpt.desktop
    applications:t3-code.desktop
    applications:com.mitchellh.ghostty.desktop
    applications:steam.desktop
