# Fedora KDE desktop profile.

[logins]
order =
    onepassword
    github
    tailscale
    agents-sudo
onepassword_label = 1Password
onepassword_default = yes
onepassword_depends_on = 1password
onepassword_requires = 1password 1password-mcp op jq
onepassword_status =
    settings="$HOME/.config/1Password/settings/settings.json" &&
    jq -e '
      .["developers.cliSharedLockState.enabled"] == true and
      .["developers.mcpIntegration.enabled"] == true
    ' "$settings" >/dev/null &&
    env -u OP_SERVICE_ACCOUNT_TOKEN -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN \
      OP_BIOMETRIC_UNLOCK_ENABLED=true op vault list --format=json 2>/dev/null |
    jq -e 'type == "array" and length > 0' >/dev/null
onepassword_prepare =
    pgrep -x 1password >/dev/null 2>&1 || (1password >/dev/null 2>&1 &!)
onepassword_instruction = Open and unlock 1Password. In Settings > Developer, enable Integrate with 1Password CLI and Integrate with MCP clients. Then press Enter. Primer will verify both settings and CLI vault access.
onepassword_done_detail = signed in with CLI and MCP integrations
github_depends_on = ssh, git, dnf
github_depends_on_logins = onepassword
tailscale_label = Tailscale
tailscale_default = yes
tailscale_depends_on = tailscale
tailscale_depends_on_logins = onepassword
tailscale_requires = tailscale jq
tailscale_status =
    tailscale status >/dev/null 2>&1 &&
    test "$(tailscale debug prefs 2>/dev/null | jq -r '.OperatorUser // ""')" = "${USER:-$LOGNAME}" &&
    test "$(tailscale debug prefs 2>/dev/null | jq -r '.RunSSH // false')" = "true"
tailscale_command =
    (tailscale status >/dev/null 2>&1 || sudo -n tailscale up --ssh) &&
    sudo -n tailscale set --operator="${USER:-$LOGNAME}" --ssh
tailscale_instruction = Press Enter to start Tailscale sign-in. Complete the browser flow. Primer will then verify the connection, Tailscale SSH, and local client administration access.
tailscale_done_detail = connected with operator access and Tailscale SSH
agents-sudo_label = Agent access
agents-sudo_default = yes
agents-sudo_depends_on = agents
agents-sudo_depends_on_logins = onepassword
agents-sudo_requires = agents op
agents-sudo_status =
    agents sudo --status >/dev/null 2>&1 &&
    ticket="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/op-ticket" &&
    test -s "$ticket" &&
    OP_SERVICE_ACCOUNT_TOKEN="$(cat "$ticket")" \
      op read "op://Agents/Cloudflare Token Minter/account id" >/dev/null 2>&1
agents-sudo_instruction = In another terminal, run `agents sudo` on this machine, or run `agents sudo <machine>` from another machine. Complete its prompts, then press Enter. Primer will verify sudo and Cloudflare vault access.
agents-sudo_done_detail = sudo and Cloudflare vault access ready

[dnf]
label = DNF packages
needs_sudo = true
bootstrap_packages =
    dnf5-plugins
coprs =
    scottames/ghostty
    alternateved/keyd
    imput/helium
    lizardbyte/stable
packages =
    zsh
    git
    gh
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    nmap-ncat
    gcc
    gcc-c++
    make
    moby-engine
    docker-compose
    keyd
    flatpak
    ghostty
    helium-bin
    qt6-qttools
    kf6-kconfig
    Sunshine

[fedora-desktop-hardware]
label = Fedora desktop hardware
depends_on = dnf
needs_sudo = true

[tailscale]
label = Tailscale
depends_on = dnf
needs_sudo = true

[caddy]
label = Caddy gateway
depends_on = tailscale, mise, 1password, agents
depends_on_logins = tailscale, onepassword, agents-sudo
needs_sudo = true
caddy_version = v2.11.4
xcaddy_version = v0.4.5
cloudflare_module = github.com/caddy-dns/cloudflare@v0.2.4
cloudflare_token_required = true
cloudflare_zone = tomagranate.com
cloudflare_reader_ref = op://Agents/Cloudflare Reader/credential
cloudflare_minter_ref = op://Agents/Cloudflare Token Minter/credential
cloudflare_account_id_ref = op://Agents/Cloudflare Token Minter/account id
legacy_cloudflare_env = /etc/agents-infra/plans.env
cloudflare_token_ref =
migrate_tailscale_serve_port = 443
migrate_tailscale_serve_target = http://127.0.0.1:3773
migrate_tailscale_serve_route = t3-code
migrate_tailscale_serve_host = t3.{machine}.tomagranate.com
dns_names =
    t3.{machine}.tomagranate.com
routes =
    t3-code

[flatpak]
label = Flatpak apps
depends_on = dnf
needs_sudo = true
remote = flathub
apps =
    com.spotify.Client
    com.discordapp.Discord
    com.yubico.yubioath
    com.moonlight_stream.Moonlight

[1password]
label = 1Password
depends_on = dnf
needs_sudo = true

[chatgpt]
label = ChatGPT
depends_on = dnf
needs_sudo = true
format = rpm

[google-chrome]
label = Google Chrome
depends_on = dnf
needs_sudo = true
format = rpm

[shell-installers]
label = Shell installers
depends_on = dnf
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      shell: sh
      args: -y -b $HOME/.local/bin
    - name: zed
      url: https://zed.dev/install.sh
      command: zed
      check: zed --version
      shell: sh
    - name: codex
      url: https://chatgpt.com/codex/install.sh
      command: codex
      check: codex --version
      shell: sh
    - name: claude
      url: https://claude.ai/install.sh
      command: claude
      check: claude --version
      shell: bash
    - name: opencode
      url: https://opencode.ai/install
      command: opencode
      check: opencode --version
      shell: bash
      args: --no-modify-path
    - name: opencode2
      url: https://opencode.ai/v2/install
      command: opencode2
      check: opencode2 --version
      shell: bash
      args: --no-modify-path
    - name: grok
      url: https://x.ai/cli/install.sh
      command: grok
      check: grok --version
      shell: bash

[npm-global]
label = Global npm CLIs
depends_on = mise
packages =
    - name: t3
      package: t3@latest
      command: t3
      check: t3 --version

[t3-code]
label = T3 Code server
depends_on = npm-global, caddy, google-chrome
depends_on_logins = tailscale
needs_sudo = true
local_port = 3773
domain_suffix = tomagranate.com
browser_command = google-chrome-stable
window_size = 1400,900
window_position = 324,110

[git]
depends_on = dnf

[ssh]
depends_on = dnf

[zsh]
depends_on = dnf

[starship]
depends_on = shell-installers

[agents]
depends_on = dnf
install_method = script

[mise]
depends_on = shell-installers
tools +=
    go:latest

[managed-settings]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh
needs_sudo = true

[ghostty]
label = Ghostty terminal
depends_on = dnf

[kde-desktop-settings]
label = KDE desktop settings
depends_on = dnf, ghostty
needs_sudo = true
virtual_desktops = 4
keyd_command = keyd
qdbus_command = qdbus-qt6

[kde-taskbar-pins]
label = KDE taskbar pins
depends_on = kde-desktop-settings, t3-code, chatgpt
qdbus_command = qdbus-qt6
launchers =
    applications:systemsettings.desktop
    applications:org.kde.discover.desktop
    applications:helium.desktop
    preferred://filemanager
    applications:1password.desktop
    applications:chatgpt.desktop
    applications:t3-code.desktop
    applications:com.mitchellh.ghostty.desktop
