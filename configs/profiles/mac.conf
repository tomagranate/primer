# macOS profile.

[logins]
github_depends_on = ssh, git, homebrew

[xcode-cli-tools]
label = Xcode CLT

[shell-installers]
label = Shell installers
depends_on = xcode-cli-tools
installers =
    - name: darkbloom
      url: https://api.darkbloom.dev/install.sh
      command: darkbloom
      check: darkbloom --version
    - name: codex
      url: https://chatgpt.com/codex/install.sh
      command: codex
      check: codex --version
      shell: sh
    - name: claude
      url: https://claude.ai/install.sh
      command: claude
      check: claude --version
      shell: bash
    - name: opencode
      url: https://opencode.ai/install
      command: opencode
      check: opencode --version
      shell: bash
      args: --no-modify-path
    - name: grok
      url: https://x.ai/cli/install.sh
      command: grok
      check: grok --version
      shell: bash

[homebrew]
label = Homebrew
depends_on = xcode-cli-tools
taps =
    tomagranate/tap
    buildkite/buildkite
    dashlane/tap
formulae =
    mise
    starship
    fzf
    ripgrep
    fd
    bat
    jq
    mas
    gh
    dockutil
    defaultbrowser
    colima
    duf
    dust
    eza
    htop
    neovim
    netcat
    corsa
    agents
    dashlane-cli
    docker
    docker-compose

[mac-app-store]
label = Mac App Store
depends_on = homebrew
mas =
    Xcode:497799835

[xcode]
label = Xcode app
depends_on = mac-app-store
app_path = /Applications/Xcode.app
simulator_platforms =
    iOS

[homebrew-apps]
label = Mac Apps
depends_on = homebrew
casks =
    google-chrome
    spotify
    discord
    t3-code
    helium-browser
    private-internet-access
    tailscale-app
    bluesnooze
    ghostty
    logi-options+
    cursor
    yubico-authenticator
app_paths =
    helium-browser:Helium.app
    tailscale-app:Tailscale.app
    private-internet-access:Private Internet Access.app

[macos]
label = macOS settings
depends_on = homebrew-apps
defaults =
    NSGlobalDomain:AppleShowAllExtensions:bool:true
    NSGlobalDomain:ApplePressAndHoldEnabled:bool:false
    com.apple.dock:tilesize:int:41
    com.apple.dock:mineffect:string:scale
    com.apple.dock:launchanim:bool:false
    com.apple.dock:autohide:bool:true
    com.apple.dock:show-recents:bool:false
    com.apple.dock:mru-spaces:bool:false
    com.apple.Spotlight:MenuItemHidden:bool:true
dock_apps =
    /System/Applications/Apps.app
    /Applications/Helium.app
    /Applications/Ghostty.app
    /Applications/Cursor.app
    /Applications/Spotify.app
    /System/Applications/Notes.app
    /System/Applications/System Settings.app
dns_servers =
    1.1.1.1
    1.0.0.1
default_browser = helium
screenshot_location = ~/Desktop/Screenshots

[ssh]
depends_on = xcode-cli-tools

[zsh]
depends_on = homebrew

[starship]
depends_on = homebrew

[agents]
label = Agents home
depends_on = homebrew
repo = tomagranate/agents-home
path = ~/.agents
formula = agents
install_method = brew

[mise]
depends_on = homebrew

[managed-settings]
depends_on = homebrew-apps

[touchid]
label = Touch ID

[ghostty]
label = Ghostty terminal
