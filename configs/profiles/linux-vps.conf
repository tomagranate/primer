# Debian/Ubuntu VPS profile.

[logins]
github_depends_on = ssh, apt

[apt]
label = APT packages
packages =
    zsh
    git
    gh
    fzf
    ripgrep
    fd-find
    bat
    jq
    eza
    htop
    neovim
    duf
    du-dust
    netcat-openbsd
    docker.io
    docker-compose-v2

[tailscale]
label = Tailscale
depends_on = apt

[shell-installers]
label = Shell installers
depends_on = apt
installers =
    - name: mise
      url: https://mise.run
      command: mise
      check: mise --version
    - name: starship
      url: https://starship.rs/install.sh
      command: starship
      check: starship --version
      args: -y

[git]
depends_on = apt

[ssh]
depends_on = apt

[zsh]
depends_on = apt

[starship]
depends_on = shell-installers

[mise]
depends_on = shell-installers

[login-shell]
label = Login shell
depends_on = zsh
