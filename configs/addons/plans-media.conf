# Plans, Media, and Previews addon: one private Agents application surface.

[addon]
label = Host Agents Plans, Media, and Previews
description = Makes this machine the shared Plans, Media, and Preview gateway. Moves their DNS to this machine.
profiles = fedora-kde

[caddy]
cloudflare_token_required = true
dns_names +=
    plans.tomagranate.com
    preview.tomagranate.com
    *.preview.tomagranate.com
routes +=
    plans-media
    agents-preview
migrate_plans_route = plans-media
migrate_plans_host = plans.tomagranate.com
migrate_plans_worker_host = agents-infra.sunburst-d5c.workers.dev
migrate_plans_config_digest = daa98464fea29d733448847f0067df5cd396c1daa308c572febb61c0116e9cb2
migrate_plans_config_digests +=
    627f1a6bf1563a95a2839629e99e6617d61566d132a51c4b431c550799c6295a
migrate_plans_local_imports +=
    /etc/caddy/relaunch-admin.Caddyfile
migrate_plans_unit_digest = a432bf9310f8830f45a7fe7cdaaea362e92c970a6cd45a367c16b12639941d05

[plans-media]
label = Plans, Media, and Previews
depends_on = caddy, agents
needs_sudo = true
host = plans.tomagranate.com
worker_host = agents-infra.sunburst-d5c.workers.dev
preview_host = preview.tomagranate.com
preview_port = 8770
legacy_secrets_file = /etc/agents-infra/plans.env
# Set this to a stable op:// reference on a machine without the legacy file.
gate_secret_ref =
