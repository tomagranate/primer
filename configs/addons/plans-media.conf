# Plans and Media addon: one private Agents application surface.

[addon]
label = Plans and Media
description = Private Plans archive and Media access through the shared gateway.
profiles = fedora-kde

[caddy]
cloudflare_token_required = true
dns_names +=
    plans.tomagranate.com
routes +=
    plans-media
migrate_plans_route = plans-media
migrate_plans_host = plans.tomagranate.com
migrate_plans_worker_host = agents-infra.sunburst-d5c.workers.dev
migrate_plans_config_digest = daa98464fea29d733448847f0067df5cd396c1daa308c572febb61c0116e9cb2

[plans-media]
label = Plans and Media
depends_on = caddy
needs_sudo = true
host = plans.tomagranate.com
worker_host = agents-infra.sunburst-d5c.workers.dev
legacy_secrets_file = /etc/agents-infra/plans.env
# Set this to a stable op:// reference on a machine without the legacy file.
gate_secret_ref =
