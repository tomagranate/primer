# Hangar cell addon: this machine runs CI job VMs for the Hangar fleet.

[addon]
label = Hangar CI cell
description = Runs GitHub Actions jobs in warm VMs on this machine, with local caches. Joins the Hangar fleet.
profiles = fedora-kde

[dnf]
packages +=
    libvirt-client
    libvirt-daemon-driver-qemu
    libvirt-daemon-driver-network
    libvirt-daemon-driver-storage-core
    qemu-system-x86-core
    qemu-img
    virt-install
    cloud-utils
    ethtool
    jq

[hangar-cell]
label = Hangar CI cell
depends_on = dnf, tailscale
depends_on_logins = tailscale, github, agents-sudo
needs_sudo = true
hangar_version = 0.1.2
hangar_sha256 = 3402ea8775f6a1b23265a31fe7af2b542808479dfdee488530a967beca976fdd
controller_url = ws://tombook-linux.terrier-jazz.ts.net:8782/cell
cell_token_ref = op://Dev/hangar/cell-token
base_image_url = https://cloud-images.ubuntu.com/releases/24.04/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
base_image_sha256 = 6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
# auto: wake this machine when jobs wait, if it has a wired NIC that supports it.
wake_on_lan = auto
