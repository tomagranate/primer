# Basil addon: Hermes and its local support services.

[addon]
label = Basil
description = Hermes gateway, monitoring, notifications, and brain sync.
profiles = fedora-kde

[caddy]
routes +=
    basil

[shell-installers]
installers +=
    - name: hermes
      url: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
      command: hermes
      check: hermes --version
      shell: bash
      args: --skip-setup

[basil]
label = Basil services
depends_on = caddy, agents, shell-installers
needs_sudo = true
repo_path = ~/code/basil
cloudflared_version = 2026.8.2
ntfy_gateway_port = 8090
kuma_gateway_port = 8443
