# Command Center addon: private fleet home page.
[addon]
label = Host Command Center
description = Runs the private fleet home page.
profiles = fedora-kde

[caddy]
dns_names +=
    tomagranate.com
routes +=
    command-center

[github-runner]
repos +=
    tomagranate/command-center

[command-center]
label = Command Center
depends_on = caddy, mise
needs_sudo = true
repo_path = ~/code/command-center
