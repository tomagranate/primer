# Gaming addon: Steam stack and Steam taskbar pin.

[addon]
label = Gaming
description = Steam, GameMode, MangoHud, Gamescope, and the Steam pin.
profiles = fedora-kde

[fedora-gaming]
label = Fedora gaming
depends_on = fedora-desktop-hardware
needs_sudo = true

[kde-taskbar-pins]
launchers +=
    applications:steam.desktop
