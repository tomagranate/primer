# Hangar controller addon: the one always-on machine that talks to GitHub and
# sends jobs to cells. Select hangar-cell on the same machine too.

[addon]
label = Hangar CI controller
description = Receives GitHub job webhooks through Tailscale Funnel and schedules jobs across Hangar cells. One machine only.
profiles = fedora-kde

[hangar-controller]
label = Hangar CI controller
depends_on = hangar-cell, tailscale
depends_on_logins = tailscale, agents-sudo
needs_sudo = true
owner = tomagranate
github_app_id_ref = op://Dev/hangar/github-app-id
github_private_key_ref = op://Dev/hangar/github-private-key
webhook_secret_ref = op://Dev/hangar/webhook-secret
cell_token_ref = op://Dev/hangar/cell-token
# Funnel allows 443, 8443, and 10000. Caddy owns 443 and 8443 here.
funnel_port = 10000
