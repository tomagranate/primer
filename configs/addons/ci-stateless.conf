[addon]
label = Stateless CI runners
description = Repository-isolated runners for trusted private-branch checks.
profiles = fedora-kde

[github-ci-runner]
label = Stateless GitHub Actions runners
needs_sudo = true
home = /var/lib/github-ci-runner
user_prefix = gha-ci-
labels = self-hosted,linux,ci-stateless,{machine}
runner_version = 2.337.0
runner_sha256 = 70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
seed_dist = /var/lib/github-runner/_dist
repos =
    tomagranate/nerve
    tomagranate/relaunch
    tomagranate/primer
    tomagranate/coolgrid
    tomagranate/set-tracker
    tomagranate/set-tracker-copy
    tomagranate/set-tracker-best
    tomagranate/keel
    tomagranate/concrete
    tomagranate/agents-infra
