# primer.conf
# Each [section] activates a module. Remove a section to disable it.
# Indented lines continue the previous key's value.

[logins]
order =
    github
github_label = GitHub CLI
github_default = yes
github_depends_on = ssh, git, homebrew
github_requires = gh
github_status =
    gh auth status --hostname github.com &&
    test "$(gh config get git_protocol --host github.com 2>/dev/null)" = ssh &&
    key_body="$(awk 'NF >= 2 { print $2; exit }' "$HOME/.ssh/id_ed25519.pub")" &&
    gh ssh-key list | grep -F "$key_body"
github_command =
    (gh auth status --hostname github.com >/dev/null 2>&1 && gh auth refresh --hostname github.com --scopes admin:public_key || gh auth login --hostname github.com --git-protocol ssh --scopes admin:public_key) &&
    gh config set git_protocol ssh --host github.com &&
    key_body="$(awk 'NF >= 2 { print $2; exit }' "$HOME/.ssh/id_ed25519.pub")" &&
    if gh ssh-key list | grep -F "$key_body" >/dev/null; then echo "SSH key already registered with GitHub."; else gh ssh-key add "$HOME/.ssh/id_ed25519.pub" --title "$(hostname -s 2>/dev/null || hostname 2>/dev/null || echo primer)"; fi

[xcode-cli-tools]
label = Xcode CLT

[shell-installers]
label = Shell installers
depends_on = xcode-cli-tools
installers =
    - name: darkbloom
      url: https://api.darkbloom.dev/install.sh
      command: darkbloom
      check: darkbloom --version

[homebrew]
label = Homebrew
depends_on = xcode-cli-tools
taps =
    tomagranate/tap
    buildkite/buildkite
    dashlane/tap
formulae =
    mise
    starship
    fzf
    ripgrep
    fd
    bat
    jq
    mas
    gh
    dockutil
    defaultbrowser
    colima
    duf
    dust
    eza
    htop
    neovim
    netcat
    opencode
    corsa
    dashlane-cli
    docker
    docker-compose

[mac-app-store]
label = Mac App Store
depends_on = homebrew
mas =
    Xcode:497799835

[xcode]
label = Xcode app
depends_on = mac-app-store
app_path = /Applications/Xcode.app
simulator_platforms =
    iOS

[homebrew-apps]
label = Mac Apps
depends_on = homebrew
casks =
    google-chrome
    spotify
    discord
    codex
    codex-app
    helium-browser
    claude-code@latest
    private-internet-access
    tailscale-app
    bluesnooze
    ghostty
    logi-options+
    cursor
    yubico-authenticator
app_paths =
    codex-app:Codex.app
    helium-browser:Helium.app
    tailscale-app:Tailscale.app

[macos]
label = macOS settings
depends_on = homebrew-apps
defaults =
    NSGlobalDomain:AppleShowAllExtensions:bool:true
    NSGlobalDomain:ApplePressAndHoldEnabled:bool:false
    com.apple.dock:tilesize:int:41
    com.apple.dock:mineffect:string:scale
    com.apple.dock:launchanim:bool:false
    com.apple.dock:autohide:bool:true
    com.apple.dock:show-recents:bool:false
    com.apple.dock:mru-spaces:bool:false
    com.apple.Spotlight:MenuItemHidden:bool:true
dock_apps =
    /System/Applications/Apps.app
    /Applications/Helium.app
    /Applications/Codex.app
    /Applications/Ghostty.app
    /Applications/Cursor.app
    /Applications/Spotify.app
    /System/Applications/Notes.app
    /System/Applications/System Settings.app
dns_servers =
    1.1.1.1
    1.0.0.1
default_browser = helium
screenshot_location = ~/Desktop/Screenshots

[ssh]
label = SSH key
key_path = ~/.ssh/id_ed25519
depends_on = xcode-cli-tools

[zsh]
label = Zsh + Zim
depends_on = homebrew

[starship]
label = Starship prompt
depends_on = homebrew

[mise]
label = Mise languages
depends_on = homebrew
tools =
    node:lts
    python:latest
    bun:latest
    rust:latest

[touchid]
label = Touch ID

[git]
label = Git CLI
settings =
    user.name:Tom Grant
    user.email:tom@sunburst.io
    user.useConfigOnly:true
    pull.rebase:false
    init.defaultBranch:master
    push.default:simple
    push.autoSetupRemote:true
    fetch.prune:true
    rerere.enabled:true
    merge.conflictStyle:zdiff3
    diff.algorithm:histogram
    column.ui:auto
    branch.sort:-committerdate
    tag.sort:version:refname

[ghostty]
label = Ghostty terminal
