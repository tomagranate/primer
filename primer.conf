# primer.conf
# Each [section] activates a module. Remove a section to disable it.
# Indented lines continue the previous key's value.

[logins]
order =
    xcode-cli-terms
    helium-google
    dashlane
    github
xcode-cli-terms_label = Xcode CLI terms
xcode-cli-terms_default = yes
xcode-cli-terms_depends_on = xcode-cli-tools
xcode-cli-terms_requires = xcodebuild, sudo
xcode-cli-terms_status = xcodebuild -checkFirstLaunchStatus
xcode-cli-terms_done_detail = accepted
xcode-cli-terms_instruction = Review and accept the Xcode Command Line Tools license.
xcode-cli-terms_command = sudo xcodebuild -license
github_label = GitHub CLI
github_default = yes
github_depends_on = ssh, homebrew
github_requires = gh
github_status = gh auth status
github_command = gh auth login
helium-google_label = Helium Google profile
helium-google_default = yes
helium-google_depends_on = homebrew-apps
helium-google_requires = open
helium-google_instruction = Sign in to your Google or Chrome profile in Helium.
helium-google_command = open -a Helium https://accounts.google.com/
dashlane_label = Dashlane
dashlane_default = yes
dashlane_depends_on = homebrew-apps
dashlane_requires = open
dashlane_instruction = Sign in to Dashlane.
dashlane_command = open -a Helium https://app.dashlane.com/login

[xcode-cli-tools]
label = Xcode CLT

[shell-installers]
label = Shell installers
depends_on = xcode-cli-tools
installers =
    - name: darkbloom
      url: https://api.darkbloom.dev/install.sh
      command: darkbloom
      check: darkbloom --version

[homebrew]
label = Homebrew
depends_on = xcode-cli-tools
taps =
    tomagranate/tap
    buildkite/buildkite
    dashlane/tap
formulae =
    mise
    starship
    fzf
    ripgrep
    fd
    bat
    jq
    mas
    gh
    dockutil
    defaultbrowser
    colima
    duf
    dust
    eza
    htop
    neovim
    netcat
    opencode
    corsa
    dashlane-cli

[mac-app-store]
label = Mac App Store
depends_on = homebrew
mas =
    Xcode:497799835

[xcode]
label = Xcode app
depends_on = mac-app-store
app_path = /Applications/Xcode.app
simulator_platforms =
    iOS

[homebrew-apps]
label = Mac Apps
depends_on = homebrew
casks =
    google-chrome
    spotify
    codex-app
    helium-browser
    claude-code@latest
    private-internet-access
    tailscale-app
    bluesnooze
    ghostty
    logi-options+
    cursor
    yubico-authenticator
app_paths =
    codex-app:Codex.app
    helium-browser:Helium.app
    tailscale-app:Tailscale.app

[macos]
label = macOS settings
depends_on = homebrew-apps
defaults =
    NSGlobalDomain:AppleShowAllExtensions:bool:true
    NSGlobalDomain:ApplePressAndHoldEnabled:bool:false
    com.apple.dock:tilesize:int:41
    com.apple.dock:mineffect:string:scale
    com.apple.dock:launchanim:bool:false
    com.apple.dock:autohide:bool:true
    com.apple.dock:show-recents:bool:false
    com.apple.dock:mru-spaces:bool:false
    com.apple.Spotlight:MenuItemHidden:bool:true
dock_apps =
    /System/Applications/Apps.app
    /Applications/Helium.app
    /Applications/Codex.app
    /Applications/Ghostty.app
    /Applications/Cursor.app
    /Applications/Spotify.app
    /System/Applications/Notes.app
    /System/Applications/System Settings.app
dns_servers =
    1.1.1.1
    1.0.0.1
default_browser = helium
screenshot_location = ~/Desktop/Screenshots

[ssh]
label = SSH key
key_path = ~/.ssh/id_ed25519
depends_on = xcode-cli-tools

[zsh]
label = Zsh + Zim
depends_on = homebrew

[starship]
label = Starship prompt
depends_on = homebrew

[mise]
label = Mise languages
depends_on = homebrew
tools =
    node:lts
    python:latest
    bun:latest
    rust:latest

[touchid]
label = Touch ID

[git]
label = Git extensions

[ghostty]
label = Ghostty terminal
