[ids]
*

[main]
# Treat the physical Super keys as the desktop command layer.
leftmeta = layer(cmd)
rightmeta = layer(cmd)
leftalt = layer(option)
rightalt = layer(option)

[cmd:C]
# Desktop launcher.
space = command(/usr/local/bin/desktop-launcher)

# Terminal-safe clipboard behavior.
c = C-insert
v = S-insert
x = S-delete

# Ghostty pane management. These use uncommon internal chords so Ghostty can
# distinguish the remapped command layer from physical Ctrl.
d = C-A-S-d
t = C-A-S-t
w = C-A-S-w

# Desktop line navigation.
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)
delete = macro(S-end delete)

# KDE app/window switching.
tab = swapm(app_switch_state, M-tab)
` = M-`

[option:A]
# Desktop word navigation and deletion.
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[app_switch_state:M]
tab = M-tab
right = M-tab
` = M-S-tab
left = M-S-tab

[cmd+control]
f = C-A-S-g

[cmd+shift]
d = C-A-S-f
