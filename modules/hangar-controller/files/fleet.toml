# VM sizes, and which runner label gets which size. A job is Hangar's when
# one of its labels is listed here.
[sizes.small]
vcpu = 2
memory_mb = 4096

# 6 GB is what the old dispatcher gave these jobs, nerve E2E included.
[sizes.medium]
vcpu = 4
memory_mb = 6144

# Nerve E2E runs the app stack, Electric, ClamAV, and Chromium in one VM; at
# 6 GB it ran out of memory and the runner was killed.
[sizes.e2e]
vcpu = 4
memory_mb = 8192

# Nerve's light jobs (builds, Docker, smoke checks) peak under 2.5 GB, so
# they fit in 4 GB. They keep 4 vCPU so typecheck and builds stay fast.
[sizes.light]
vcpu = 4
memory_mb = 4096

[sizes.large]
vcpu = 8
memory_mb = 16384

[labels]
ci-stateless = "medium"
ci-container = "medium"
# Deploys build assets too (nerve web build): 2 vCPU timed out. The old
# dispatcher gave them 4 vCPU and 6 GB.
ci-deploy = "medium"
ci-e2e = "e2e"
ci-light = "light"
ci-large = "large"
