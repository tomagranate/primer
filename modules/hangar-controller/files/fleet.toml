# VM sizes, and which runner label gets which size. A job is Hangar's when
# one of its labels is listed here.
[sizes.small]
vcpu = 2
memory_mb = 4096

# 6 GB is what the old dispatcher gave these jobs, nerve E2E included.
[sizes.medium]
vcpu = 4
memory_mb = 6144

[sizes.large]
vcpu = 8
memory_mb = 16384

[labels]
ci-stateless = "medium"
ci-container = "medium"
# Deploys build assets too (nerve web build): 2 vCPU timed out. The old
# dispatcher gave them 4 vCPU and 6 GB.
ci-deploy = "medium"
ci-large = "large"
